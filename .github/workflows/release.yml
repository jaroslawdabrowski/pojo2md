name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>central</id>
                <username>${env.CENTRAL_TOKEN_USERNAME}</username>
                <password>${env.CENTRAL_TOKEN_PASSWORD}</password>
              </server>
              <server>
                <id>gpg.passphrase</id>
                <passphrase>${env.MAVEN_GPG_PASSPHRASE}</passphrase>
              </server>
            </servers>
          </settings>
          EOF

      - name: Import GPG key
        run: echo "${{ secrets.MAVEN_GPG_PRIVATE_KEY }}" | gpg --import --batch

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          PATCH=${VERSION##*.}
          NEXT_PATCH=$((PATCH + 1))
          NEXT_SNAPSHOT="${VERSION%.*}.${NEXT_PATCH}-SNAPSHOT"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "NEXT_SNAPSHOT=${NEXT_SNAPSHOT}" >> "$GITHUB_OUTPUT"

      - name: Set version in pom.xml
        run: ./mvnw versions:set -DnewVersion=${{ steps.version.outputs.VERSION }} -DgenerateBackupPoms=false

      - name: Build, verify and publish to GitHub Packages
        run: ./mvnw deploy -Pci,release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Publish to Maven Central
        run: ./mvnw deploy -Prelease,central -DskipTests
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            target/pojo2md-${{ steps.version.outputs.VERSION }}.jar
            target/pojo2md-${{ steps.version.outputs.VERSION }}-sources.jar
            target/pojo2md-${{ steps.version.outputs.VERSION }}-javadoc.jar

      - name: Bump to next SNAPSHOT on main
        run: |
          ./mvnw versions:set -DnewVersion=${{ steps.version.outputs.NEXT_SNAPSHOT }} -DgenerateBackupPoms=false
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add pom.xml
          git commit -m "chore: bump version to ${{ steps.version.outputs.NEXT_SNAPSHOT }} [skip ci]"
          git push origin main
