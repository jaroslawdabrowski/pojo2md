name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          PATCH=${VERSION##*.}
          NEXT_PATCH=$((PATCH + 1))
          NEXT_SNAPSHOT="${VERSION%.*}.${NEXT_PATCH}-SNAPSHOT"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "NEXT_SNAPSHOT=${NEXT_SNAPSHOT}" >> "$GITHUB_OUTPUT"

      - name: Set version in pom.xml
        run: ./mvnw versions:set -DnewVersion=${{ steps.version.outputs.VERSION }} -DgenerateBackupPoms=false

      - name: Build, verify and publish to GitHub Packages
        run: ./mvnw deploy -Pci,release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            target/pojo2md-${{ steps.version.outputs.VERSION }}.jar
            target/pojo2md-${{ steps.version.outputs.VERSION }}-sources.jar
            target/pojo2md-${{ steps.version.outputs.VERSION }}-javadoc.jar

      - name: Bump to next SNAPSHOT on main
        run: |
          ./mvnw versions:set -DnewVersion=${{ steps.version.outputs.NEXT_SNAPSHOT }} -DgenerateBackupPoms=false
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add pom.xml
          git commit -m "chore: bump version to ${{ steps.version.outputs.NEXT_SNAPSHOT }} [skip ci]"
          git push origin main
