<svg width="400" height="540" viewBox="0 0 400 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="c-body">
      <ellipse cx="192" cy="295" rx="68" ry="50" transform="rotate(3 192 295)"/>
    </clipPath>
  </defs>

  <!-- Parchment background -->
  <rect width="400" height="540" fill="#F5F0E0"/>

  <!-- Outer border -->
  <rect x="7" y="7" width="386" height="526" fill="none" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Inner thin border -->
  <rect x="12" y="12" width="376" height="516" fill="none" stroke="#1A1A1A" stroke-width="0.6"/>

  <!-- ─── HEADER ─── -->
  <rect x="7" y="7" width="386" height="100" fill="#1A1A1A"/>
  <rect x="12" y="12" width="376" height="90" fill="none" stroke="#3A3A3A" stroke-width="0.5"/>

  <text x="200" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="9" letter-spacing="5" fill="#666">ANNOTATION-DRIVEN LIBRARY</text>
  <text x="200" y="73" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="bold" letter-spacing="5" fill="#F0DC55">pojo2md</text>
  <text x="200" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="11" letter-spacing="3" fill="#888">Java → Markdown Mapper</text>

  <!-- Orange strip -->
  <rect x="7" y="107" width="386" height="6" fill="#CC4A08"/>
  <rect x="7" y="113" width="386" height="1.5" fill="#9A3606"/>

  <!-- ─── ILLUSTRATION ─── -->

  <!-- Ground shadow + line -->
  <ellipse cx="192" cy="425" rx="90" ry="7" fill="rgba(0,0,0,0.07)"/>
  <line x1="75" y1="422" x2="315" y2="422" stroke="#9B8468" stroke-width="1"/>

  <!-- == TAIL (short white feathers, no plumes) == -->
  <path d="M 128,292 Q 112,312 108,332 Q 119,317 132,298 Z" fill="white" stroke="#1A1A1A" stroke-width="1"/>
  <path d="M 122,302 Q 104,325 102,346 Q 114,329 126,308 Z" fill="white" stroke="#1A1A1A" stroke-width="0.8"/>

  <!-- == BODY == -->
  <ellipse cx="192" cy="295" rx="68" ry="50" transform="rotate(3 192 295)" fill="white" stroke="#1A1A1A" stroke-width="1.8"/>

  <!-- Body subtle texture -->
  <g clip-path="url(#c-body)" opacity="0.1">
    <line x1="142" y1="262" x2="160" y2="337" stroke="#1A1A1A" stroke-width="0.9"/>
    <line x1="153" y1="259" x2="172" y2="334" stroke="#1A1A1A" stroke-width="0.9"/>
    <line x1="165" y1="257" x2="186" y2="331" stroke="#1A1A1A" stroke-width="0.9"/>
    <line x1="177" y1="255" x2="201" y2="328" stroke="#1A1A1A" stroke-width="0.9"/>
    <line x1="190" y1="255" x2="215" y2="325" stroke="#1A1A1A" stroke-width="0.9"/>
    <line x1="202" y1="257" x2="229" y2="324" stroke="#1A1A1A" stroke-width="0.9"/>
    <line x1="214" y1="261" x2="241" y2="325" stroke="#1A1A1A" stroke-width="0.9"/>
    <line x1="225" y1="266" x2="251" y2="329" stroke="#1A1A1A" stroke-width="0.9"/>
  </g>

  <!-- == LEFT WING (spread) — white base + black primaries == -->
  <path d="M 150,285 Q 97,260 55,238 Q 67,260 92,273 Q 120,285 149,297 Z"
        fill="white" stroke="#1A1A1A" stroke-width="1.6"/>
  <!-- Black primary feathers (outer third) -->
  <path d="M 55,238 Q 80,252 100,264 Q 82,261 67,255 Q 57,248 55,238 Z" fill="#1A1A1A"/>
  <path d="M 68,256 Q 93,268 112,278 Q 94,274 77,267 Q 66,261 68,256 Z" fill="#1A1A1A" opacity="0.72"/>
  <!-- Wing feather lines (white section) -->
  <line x1="148" y1="289" x2="108" y2="272" stroke="#1A1A1A" stroke-width="0.8" opacity="0.45"/>
  <line x1="146" y1="294" x2="106" y2="278" stroke="#1A1A1A" stroke-width="0.8" opacity="0.45"/>
  <line x1="144" y1="299" x2="104" y2="284" stroke="#1A1A1A" stroke-width="0.8" opacity="0.45"/>

  <!-- == RIGHT WING (folded, partially visible) == -->
  <path d="M 240,278 Q 283,260 306,248 Q 297,263 279,273 Q 260,281 242,287 Z"
        fill="white" stroke="#1A1A1A" stroke-width="1.4"/>
  <!-- Black primaries right wing -->
  <path d="M 306,248 Q 316,244 322,252 Q 314,249 307,256 Z" fill="#1A1A1A"/>
  <path d="M 298,254 Q 311,249 320,258 Q 310,254 300,261 Z" fill="#1A1A1A" opacity="0.6"/>

  <!-- == NECK (storks hold neck more upright, less S-curve) == -->
  <path d="M 238,272 Q 249,215 257,158"
        stroke="#1A1A1A" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M 238,272 Q 249,215 257,158"
        stroke="white" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- == HEAD == -->
  <ellipse cx="258" cy="151" rx="15" ry="12" fill="white" stroke="#1A1A1A" stroke-width="1.8"/>

  <!-- Eye with orange-red orbital ring (characteristic stork feature) -->
  <circle cx="267" cy="148" r="3.5" fill="#1A1A1A"/>
  <circle cx="268" cy="147" r="1.3" fill="white"/>
  <circle cx="267" cy="148" r="5.5" fill="none" stroke="#C83000" stroke-width="1" opacity="0.55"/>

  <!-- BEAK — heavy, orange-red, stork-style -->
  <path d="M 271,150 L 318,141 L 272,161 Z" fill="#CC4400" stroke="#882800" stroke-width="1"/>
  <line x1="271" y1="155" x2="317" y2="146" stroke="#882800" stroke-width="0.9" opacity="0.55"/>

  <!-- == LEGS (orange-red) == -->
  <path d="M 180,340 Q 175,382 174,422" stroke="#CC4400" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 203,342 Q 209,384 213,422" stroke="#CC4400" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Knee joints -->
  <circle cx="175" cy="379" r="4.2" fill="#CC4400"/>
  <circle cx="210" cy="381" r="4.2" fill="#CC4400"/>

  <!-- Feet left -->
  <line x1="174" y1="422" x2="149" y2="432" stroke="#CC4400" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="174" y1="422" x2="170" y2="436" stroke="#CC4400" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="174" y1="422" x2="188" y2="432" stroke="#CC4400" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="174" y1="422" x2="162" y2="415" stroke="#CC4400" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/>
  <!-- Feet right -->
  <line x1="213" y1="422" x2="192" y2="432" stroke="#CC4400" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="213" y1="422" x2="211" y2="436" stroke="#CC4400" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="213" y1="422" x2="228" y2="430" stroke="#CC4400" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="213" y1="422" x2="221" y2="415" stroke="#CC4400" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/>

  <!-- Grass tufts -->
  <line x1="143" y1="422" x2="140" y2="407" stroke="#9B8040" stroke-width="1.1" opacity="0.42"/>
  <line x1="149" y1="422" x2="147" y2="405" stroke="#9B8040" stroke-width="1.1" opacity="0.42"/>
  <line x1="155" y1="422" x2="154" y2="409" stroke="#9B8040" stroke-width="1.1" opacity="0.42"/>
  <line x1="233" y1="422" x2="231" y2="406" stroke="#9B8040" stroke-width="1.1" opacity="0.42"/>
  <line x1="239" y1="422" x2="239" y2="404" stroke="#9B8040" stroke-width="1.1" opacity="0.42"/>
  <line x1="245" y1="422" x2="247" y2="408" stroke="#9B8040" stroke-width="1.1" opacity="0.42"/>

  <!-- Latin species name -->
  <text x="200" y="443" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="10" fill="#888">Ciconia ciconia · White Stork</text>

  <!-- ─── FOOTER ─── -->
  <rect x="7" y="458" width="386" height="75" fill="#1A1A1A"/>
  <line x1="35" y1="474" x2="365" y2="474" stroke="#3A3A3A" stroke-width="0.8"/>
  <text x="200" y="492" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="2" fill="#C8C8C8">Annotation-Driven Markdown Generation</text>
  <text x="200" y="509" text-anchor="middle" font-family="Georgia, serif" font-size="10" letter-spacing="1" fill="#707070">for Java POJOs</text>
  <line x1="35" y1="517" x2="365" y2="517" stroke="#3A3A3A" stroke-width="0.8"/>
</svg>
